# reports/agentfield_additive.yml
#
# ---------------------------------------------------------------
# Source of truth for the SHAs included in the AgentField
# consolidated-diff report (`reports/agentfield_consolidated_diff_*.md`).
# ---------------------------------------------------------------
# To add a new additive commit:
#   1. Append its short SHA below (in chronological order).
#   2. Add the matching `### \`<sha>\` — <subject>` heading + markdown
#      table skeleton to the consolidated-diff report (File Path |
#      Lines Added | Lines Removed | Files Changed | Behavioural Delta).
#      Behavioural Delta prose stays human-written; the script fills
#      only the 3 numeric columns.
#   3. Run `make consolidate-diff` (or just `git commit` — the
#      pre-commit hook fires automatically).

