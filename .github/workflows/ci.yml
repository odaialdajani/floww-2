name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Truth audit
        run: bash qc/audit/truth_audit.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # MUST stay 3.11 — that is the runtime that actually ships:
          #   Dockerfile.backend:1        FROM python:3.11-slim AS production
          #   .github/workflows/deploy.yml:25   python-version: "3.11"
          # Testing on any other version validates code that production never
          # runs. A previous pass bumped this to "3.13"; that hid a real defect
          # (see below) rather than fixing it, so it is reverted.
          #
          # KNOWN RED: backend/routes/quant.py:187 uses a PEP 701 f-string that
          # reuses the outer quote character. That syntax is Python 3.12+ only,
          # so the file is a SyntaxError on 3.11 and server.py imports it
          # (server.py:2734 `from routes.quant import router as quant_router`).
          # This job will fail here until quant.py:187 is fixed — that failure
          # is CORRECT: the shipped python:3.11-slim image cannot import
          # server.py today either. Do NOT silence it by raising this pin.
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov bandit

      - name: Lint with ruff
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          pip install "ruff==0.15.22"
          ruff check . --output-format=github

      # ADVISORY / NON-BLOCKING. The `|| true` below means this step can never
      # fail the job — a green CI run says NOTHING about type correctness. It is
      # kept only so the mypy output is visible in the log. Do not read it as a
      # gate; to make it one, delete the `|| true` and fix what it reports.
      - name: Type check with mypy (advisory — cannot fail the build)
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          pip install mypy
          mypy --ignore-missing-imports server.py || true

      - name: Security scan with bandit
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          bandit -r . --severity-level medium -q --exclude ./.venv,./tests --skip B101,B108,B301,B310,B313,B314,B324,B604,B608,B614,B615

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: confluence_decoder_test
          DATABENTO_API_KEY: ""
          POLYGON_API_KEY: ""
          ALPHA_VANTAGE_KEY: ""
          FINNHUB_API_KEY: ""
          OPENROUTER_API_KEY: test-key-ci
          GEMINI_API_KEY: test-key-ci
          APCA_API_KEY: ""
          APCA_SECRET_KEY: ""
          FLASHALPHA_API_KEY: ""
          MARKETSTACK_API_KEY: ""
          API_SECRET_KEY: ""
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short --cov=. -m "not flaky_env"

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        # react-day-picker@8 peers date-fns ^2||^3 but our pin is 4.x — npm 7+
        # rejects this even though the lockfile already resolves it. Mirror the
        # local install flow so CI matches dev.
        run: npm ci --legacy-peer-deps

      # No frontend lint step: linting is disabled on purpose. craco.config.js
      # strips ESLintWebpackPlugin and eslint-loader from the webpack config and
      # there is no eslint config file, so package.json has no `lint` script.
      # The step that used to live here ran `npm run lint || true`, which could
      # only ever fail-and-be-masked. Backend lint still gates (ruff, above).

      - name: Tests
        working-directory: ./frontend
        # This suite is green and MUST gate: 280 passed / 280 total across 44
        # suites. The previous `continue-on-error: true` cited 12-18 failing
        # visual-panel / axios-mock tests; those are fixed and the claim was
        # stale, so the mask is removed.
        #
        # CAVEAT on that 280/280 evidence: it was gathered locally on Node
        # v24. This job pins node-version "20" above, so the gate has not yet
        # been observed green on the CI Node. If the FIRST run after this
        # change fails, check for a Node 20-vs-24 difference (jsdom/jest
        # engine behaviour) before assuming a code regression.
        env:
          CI: true
        # CRA's `react-scripts test` runs jest in watch mode by default; --watchAll=false
        # forces single-run mode for CI.
        run: npm test -- --watchAll=false

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          CI: true

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t confluence-decoder-backend .

      - name: Build frontend Docker image
        run: docker build -f Dockerfile.frontend -t confluence-decoder-frontend .

      - name: Test Docker images
        run: |
          docker run --rm confluence-decoder-backend python -c "import server; print('Backend OK')"
          docker run --rm confluence-decoder-frontend ls -la build/