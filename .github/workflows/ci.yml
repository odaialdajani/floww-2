name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # Hard ceiling so this job can never again eat GitHub's default 6-hour limit.
    # On 2026-09-04 the first run ever to execute did exactly that and was killed,
    # taking docker-build and the deploy gate down with it (both "skipped"), so a
    # whole day produced no backend signal at all. Failing at 45 minutes tells us
    # something is wrong in 45 minutes. pytest-timeout (see backend/pytest.ini)
    # should fire first and name the offending test; this is the backstop.
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Truth audit
        run: bash qc/audit/truth_audit.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # MUST stay 3.11 — that is the runtime that actually ships:
          #   Dockerfile.backend:1        FROM python:3.11-slim AS production
          #   .github/workflows/deploy.yml:25   python-version: "3.11"
          # Testing on any other version validates code that production never
          # runs. quant.py:187 PEP-701 defect fixed (d29ae3f), so 3.11 is green.
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-timeout is not optional here — it is what turns a hung test
          # into a named failure instead of a 6-hour stall (see backend/pytest.ini).
          pip install pytest pytest-asyncio httpx pytest-cov bandit pytest-timeout

      - name: Lint with ruff
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          pip install "ruff==0.15.22"
          ruff check . --output-format=github

      # ADVISORY / NON-BLOCKING. The `|| true` below means this step can never
      # fail the job — a green CI run says NOTHING about type correctness. It is
      # kept only so the mypy output is visible in the log. Do not read it as a
      # gate; to make it one, delete the `|| true` and fix what it reports.
      - name: Type check with mypy (advisory — cannot fail the build)
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          pip install mypy
          mypy --ignore-missing-imports server.py || true

      - name: Security scan with bandit
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          bandit -r . --severity-level medium -q --exclude ./.venv,./tests --skip B101,B108,B301,B310,B313,B314,B324,B604,B608,B614,B615

      - name: Run tests with coverage
        timeout-minutes: 15
        working-directory: ./backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: confluence_decoder_test
          DATABENTO_API_KEY: ""
          POLYGON_API_KEY: ""
          ALPHA_VANTAGE_KEY: ""
          FINNHUB_API_KEY: ""
          OPENROUTER_API_KEY: test-key-ci
          GEMINI_API_KEY: test-key-ci
          APCA_API_KEY: ""
          APCA_SECRET_KEY: ""
          FLASHALPHA_API_KEY: ""
          MARKETSTACK_API_KEY: ""
          API_SECRET_KEY: ""
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short --cov=. -m "not flaky_env"

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        # react-day-picker@8 peers date-fns ^2||^3 but our pin is 4.x — npm 7+
        # rejects this even though the lockfile already resolves it. Mirror the
        # local install flow so CI matches dev.
        run: npm ci --legacy-peer-deps

<      # No frontend lint step: linting is disabled on purpose. craco.config.js
      # strips ESLintWebpackPlugin and eslint-loader from the webpack config and
      # there is no eslint config file, so package.json has no `lint` script.
      # Backend lint still gates (ruff, above). CRA production build compiles
      # with eslint warnings-as-errors and is the current lint signal.

      # Deterministic, cheap gate: catch untracked frontend source files.
      # Fails closed so the run stops before the Tests step.
      - name: Frontend filesystem integrity
        working-directory: ./frontend
        run: |
          set -euo pipefail
          echo "Checking for untracked frontend source files..."
          RAW=$(git ls-files --others --exclude-standard src/)
          UNTRACKED=$(echo "$RAW" | grep -E '\.(jsx|js|css|ts|tsx)$' || true)
          if [ -z "$UNTRACKED" ]; then
            echo "OK: no untracked frontend source files."
            exit 0
          fi
          echo "::error::Untracked frontend source files detected:"
          echo "$UNTRACKED"
          echo "Commit or remove them before merge. Run: git add <files> or rm <files>"
          exit 1

      # Deterministic, cheap gate: catch untracked frontend source files (e.g. a
      # dangling panel JSX + shared CSS dropped into the worktree by another
      # agent's checkout). Those build locally and vanish on a clean clone, so
      # the failure only ever shows up after merge. Fails closed. Note the path
      # is `src/` not `frontend/src/` — this step already runs with
      # working-directory ./frontend, and the longer form silently resolves to
      # frontend/frontend/src/ and matches nothing.
      - name: Frontend filesystem integrity
        working-directory: ./frontend
        run: |
          set -euo pipefail
          echo "Checking for untracked frontend source files..."
          RAW=$(git ls-files --others --exclude-standard src/)
          UNTRACKED=$(echo "$RAW" | grep -E '\.(jsx|js|css|ts|tsx)$' || true)
          if [ -z "$UNTRACKED" ]; then
            echo "OK: no untracked frontend source files."
            exit 0
          fi
          echo "::error::Untracked frontend source files detected:"
          echo "$UNTRACKED"
          echo "Commit or remove them before merge. Run: git add <files> or rm <files>"
          exit 1

      - name: Tests
        working-directory: ./frontend
        # This suite MUST gate (no continue-on-error). Baselines: 280/280 (44 suites)
        # and 59 suites / 453 tests on newer Node — counts drift as suites land,
        # so failures block the gate from here on regardless of exact total.
        env:
          CI: true
        # CRA's `react-scripts test` runs jest in watch mode by default; --watchAll=false
        # forces single-run mode for CI.
        run: npm test -- --watchAll=false

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          CI: true

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t confluence-decoder-backend .

      - name: Build frontend Docker image
        run: docker build -f Dockerfile.frontend -t confluence-decoder-frontend .

      - name: Test Docker images
        run: |
          docker run --rm confluence-decoder-backend python -c "import server; print('Backend OK')"
          docker run --rm confluence-decoder-frontend ls -la build/
