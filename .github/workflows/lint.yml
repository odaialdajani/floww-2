name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # 3.12 = the shipped runtime (Dockerfile.backend:1
          # python:3.12-slim, deploy.yml:52 python-version "3.12",
          # ci.yml:48 python-version "3.12"; backend/pyproject.toml:3-12
          # records the same correction). ruff itself is a standalone binary
          # and reads its target-version from backend/pyproject.toml, so this
          # pin does not affect lint results — but the silent-except gate below
          # is a Python script, and it must run on the version that ships.
          python-version: '3.12'
      - name: Install ruff
        run: pip install "ruff==0.15.22"
      - name: Check F841 (unused variables)
        working-directory: backend
        run: ruff check . --select F841
      - name: Run full ruff check
        working-directory: backend
        run: ruff check .
      - name: Gate — no NEW silent except-pass without justification (GSD #11)
        # A silent handler — `except:` / `except Exception:` / `except
        # BaseException:` whose whole body is `pass` or `...` — must carry a
        # "# silent by design: <reason>" comment at the site. Tests are exempt.
        #
        # This used to be an inline grep/sed pipeline that NEVER fired: GNU grep
        # writes -A1 context lines as `file-LINENO-content` (dash), while the
        # filter matched `file:LINENO:content` (colon), so the offender list was
        # always empty and the step always exited 0. It also read the line AFTER
        # the `pass`. Replaced by a real ast/tokenize parser.
        #
        # The parser has its own pytest suite —
        # backend/tests/test_check_silent_excepts.py — which covers the positive
        # cases, the justification marker, BaseException, `...` bodies, the
        # string-literal-is-not-a-comment case, and the grandfather-list
        # ratchet. It builds every fixture with tmp_path, so it does not depend
        # on live backend source. That suite runs in the backend-tests job of
        # ci.yml, not here.
        #
        # PATH: this step deliberately has NO working-directory (the two ruff
        # steps above do). The script lives at repo-root qc/audit/, not under
        # backend/, so running it from backend/ - as this step used to - died
        # with "can't open file .../backend/qc/audit/check_silent_excepts.py"
        # and exit 2 on every push and PR. The gate never once ran.
        run: python3 qc/audit/check_silent_excepts.py
      - name: Gate — API docs match the app
        # docs/api/openapi.json + docs/api/README.md are generated from the
        # live FastAPI app. They shipped stale (156 paths vs 369 real routes,
        # and every README row missing its path), so this step fails the build
        # when a route is added or removed without regenerating them.
        # Needs the backend on sys.path because the generator imports
        # `server.app` to read app.openapi().
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python ../qc/audit/generate_api_docs.py --check
