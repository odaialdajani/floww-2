# Azure App Service Deployment Configuration
# Deploys Confluence Decoder to Azure using the free/cheap tier.
#
# DISARMED 2026-09-05 — MANUAL TRIGGER ONLY. Read before re-arming.
#
# floww is not hosted anywhere. It runs locally: backend on :8000, React on
# :3000. This workflow used to fire automatically after every green CI/CD run
# and FAILED every single time, because the repository has zero Actions secrets
# configured:
#     $ gh api repos/odaialdajani/floww-2/actions/secrets --jq '.total_count'
#     0
# so AZURE_WEBAPP_PUBLISH_PROFILE, AZURE_STATIC_WEB_APPS_API_TOKEN and
# REACT_APP_BACKEND_URL all resolve to empty strings and azure/webapps-deploy
# aborts. Nothing has ever been deployed by this file. Run 33943345612 (failure,
# 2m35s) is the most recent example. A job that is red on every green build
# teaches you to ignore red, which is worse than having no deploy at all.
#
# Also note the repo documents a DIFFERENT intended target: CLAUDE.md and
# deploy/free/README.md describe an Oracle Always Free VM running
# docker-compose behind Caddy. infra/ carries all three (azure/, caddy/,
# terraform/). Azure is the one nothing points at.
#
# To re-arm: add the three secrets above, then uncomment the workflow_run
# trigger. The `if:` on deploy-backend already handles both trigger shapes.
name: Deploy to Azure

on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: ["CI/CD"]
  #   types: [completed]
  #   branches: [main]

permissions:
  contents: read

jobs:
  deploy-backend:
    # Under workflow_dispatch there is no github.event.workflow_run, so the
    # original condition alone would silently skip a hand-started run and
    # report success having done nothing. Both trigger shapes are covered.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt pytest-asyncio pytest-cov

      - name: Smoke import check
        working-directory: ./backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: confluence_decoder_test
          OPENROUTER_API_KEY: test-key-ci
        run: |
          source .venv/bin/activate
          python -c "import server; print('server imports OK')"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "floww-prod-app"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend/build"
          skip_app_build: true