<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#07080a" />
    <meta name="description" content="Meridian — Institutional GEX Terminal. Real-time options flow, gamma exposure, and market analytics." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Floww" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#07080a" />
    <meta name="msapplication-config" content="none" />

    <!-- PWA manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Icons (SVG works for all sizes in modern browsers) -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icons/icon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon.svg" />

    <!-- Self-hosted Inter + Space Grotesk -->
    <link rel="stylesheet" href="%PUBLIC_URL%/fonts/local-fonts.css" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <title>Meridian</title>

    <script>
      // Prevent FOUC: apply theme before React loads
      (function() {
        try {
          var theme = localStorage.getItem('floww_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) { /* noop */ }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Register service worker (only in production builds).
      // R8-06: 127.0.0.1 and [::1] are the same machine as localhost — the
      // kill-switch SW reloads every controlled page on activate, which
      // turned local IP-literal dev sessions into a reload loop (aborted
      // fetches, blank captures). Never register on loopback.
      var __host = window.location.hostname;
      var __isLoopback = (__host === 'localhost' || __host === '127.0.0.1' || __host === '[::1]');
      if ('serviceWorker' in navigator && !__isLoopback) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function(reg) {
              console.log('SW registered:', reg.scope);
            })
            .catch(function(err) {
              console.log('SW registration failed:', err);
            });
        });
      }
      // Also register in development for testing PWA install
      if ('serviceWorker' in navigator && window.location.hostname === 'localhost' && window.__SW_DEBUG__) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function(reg) {
              console.log('SW registered (dev):', reg.scope);
            })
            .catch(function(err) {
              console.log('SW registration failed (dev):', err);
            });
        });
      }
    </script>
  </body>
</html>
