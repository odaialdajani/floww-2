<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#07080a" />
    <meta name="application-name" content="FLOWW" />
    <meta name="description" content="FLOWW — Options activity, price levels, and market research." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FLOWW" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#07080a" />
    <meta name="msapplication-config" content="none" />

    <!-- PWA manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Icons (SVG works for all sizes in modern browsers) -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icons/icon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon.svg" />

    <!-- Self-hosted Inter + Space Grotesk -->
    <link rel="stylesheet" href="%PUBLIC_URL%/fonts/local-fonts.css" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <title>FLOWW</title>

    <script>
      // Prevent FOUC: apply theme before React loads
      (function() {
        try {
          var theme = localStorage.getItem('floww_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) { /* noop */ }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Service worker retired: do not register it again. Keep service-worker.js
         available so existing installations can update, clear old caches, and
         unregister once without restarting the registration/reload cycle. -->
  </body>
</html>
