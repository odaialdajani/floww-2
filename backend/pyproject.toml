[project]
name = "floww-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [
    ".venv",
    "services/ml/inference.py",
    "services/dash_ui.py",
    "tests/conftest.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM102", "SIM108", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F403", "F811", "E402"]
"server.py" = ["E402"]
"data_collector.py" = ["E402"]
"cron_runner.py" = ["E402"]
"scripts/*.py" = ["E402"]
"services/kanban/*.py" = ["E402"]
"services/hawkes_process.py" = ["E402"]
"services/agentfield_hub.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.coverage.run]
source = ["."]
omit = [
    ".venv/**",
    "tests/**",
    "scripts/**",
    "*/__pycache__/**",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "services.rate_limit_tracker"
strict = true

[[tool.mypy.overrides]]
module = "services.oi_change_detector"
strict = true

[[tool.mypy.overrides]]
module = "services.iv_skew_analyzer"
strict = true

[[tool.mypy.overrides]]
module = "services.greek_aggregator"
strict = true

[[tool.mypy.overrides]]
module = "services.vpin_engine"
strict = true

[[tool.mypy.overrides]]
module = "services.hawkes_process"
strict = true

[[tool.mypy.overrides]]
module = "services.stochastic_vol"
strict = true

[[tool.mypy.overrides]]
module = "services.liquidity_metrics"
strict = true

[[tool.mypy.overrides]]
module = "services.numba_greeks"
strict = true

[[tool.mypy.overrides]]
module = "services.execution_engine"
strict = true

[[tool.mypy.overrides]]
module = "services.trinity_alignment"
strict = true

[[tool.mypy.overrides]]
module = "services.slo_tracker"
strict = true

[[tool.mypy.overrides]]
module = "services.node_lifecycle"
strict = true
