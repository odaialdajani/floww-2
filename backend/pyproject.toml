[project]
name = "floww-backend"
version = "0.1.0"
# 3.11 is the runtime this project actually ships and tests on:
#   Dockerfile.backend:1              FROM python:3.11-slim AS production
#   .github/workflows/deploy.yml:25   python-version: "3.11"
#   .github/workflows/ci.yml          python-version: "3.11"
# The previous ">=3.12" floor did not match any of those.
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
# MUST track requires-python. With target-version above the real runtime, the
# UP rules propose syntax the shipped interpreter cannot parse, and ruff stops
# reporting genuine 3.12+-only syntax as invalid. Setting py311 immediately
# surfaced one such site: routes/quant.py:187 (PEP 701 f-string reusing the
# outer quote, 3.12+ only) is a SyntaxError under python:3.11-slim.
target-version = "py311"
extend-exclude = [
    ".venv",
    "services/ml/inference.py",
    "services/dash_ui.py",
    "tests/conftest.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM102", "SIM108", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F403", "F811", "E402", "E701"]
"scripts/**/*.py" = ["E701", "E702", "E741", "E402", "B904", "W291", "W293", "E722"]
"routes/admin.py" = ["E402"]
"services/research/discovery.py" = ["E402"]
"scripts/train_v5_real_data_ml.py" = ["B008"]
"server.py" = ["E402"]
"data_collector.py" = ["E402"]
"cron_runner.py" = ["E402"]
"scripts/*.py" = ["E402"]
"services/kanban/*.py" = ["E402"]
"services/hawkes_process.py" = ["E402"]
"services/agentfield_hub.py" = ["E402"]

# NOTE: there is deliberately NO [tool.pytest.ini_options] block here.
# backend/pytest.ini exists, and pytest ranks pytest.ini ABOVE pyproject.toml,
# so any pytest block written here is dead config. While one existed, pytest
# said so on every run:
#   configfile: pytest.ini (WARNING: ignoring pytest config in pyproject.toml!)
# The block that used to sit here declared only testpaths + asyncio_mode, both
# of which already live in pytest.ini with the same values, so deleting it
# changed nothing (4581 tests collected before and after).
# Put pytest settings in backend/pytest.ini.

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/**",
    "tests/**",
    "scripts/**",
    "*/__pycache__/**",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
]

[tool.mypy]
# Match the shipped runtime (see requires-python above), not a version this
# project never runs on.
python_version = "3.11"

[[tool.mypy.overrides]]
module = "services.rate_limit_tracker"
strict = true

[[tool.mypy.overrides]]
module = "services.oi_change_detector"
strict = true

[[tool.mypy.overrides]]
module = "services.iv_skew_analyzer"
strict = true

[[tool.mypy.overrides]]
module = "services.greek_aggregator"
strict = true

[[tool.mypy.overrides]]
module = "services.vpin_engine"
strict = true

[[tool.mypy.overrides]]
module = "services.hawkes_process"
strict = true

[[tool.mypy.overrides]]
module = "services.stochastic_vol"
strict = true

[[tool.mypy.overrides]]
module = "services.liquidity_metrics"
strict = true

[[tool.mypy.overrides]]
module = "services.numba_greeks"
strict = true
