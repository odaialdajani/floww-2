# THE pytest config for this project — put pytest settings HERE.
# pytest ranks pytest.ini above pyproject.toml, so a [tool.pytest.ini_options]
# block in backend/pyproject.toml is dead config. While one existed, every run
# printed:
#   configfile: pytest.ini (WARNING: ignoring pytest config in pyproject.toml!)
# It has been removed, so that warning no longer appears; the header now reads
# just "configfile: pytest.ini". Do not re-add a pytest block to pyproject.toml.
[pytest]
asyncio_mode = auto
testpaths = tests
# `norecursedirs` is what actually keeps tests/service_tests out of collection.
# An `ignore = tests/service_tests` line used to sit below it; `ignore` is not
# a pytest ini option, so it did nothing except emit
# "PytestConfigWarning: Unknown config option: ignore" on every run.
norecursedirs = service_tests
# A hung test must FAIL AND NAME ITSELF, not stall the run.
# On 2026-09-04 the first CI run ever to execute burned GitHub's full 6-hour job
# ceiling on this suite and was killed, so every job behind it (docker-build,
# deploy) was skipped and nothing was learned. 120s is far above any honest test
# here — a test that exceeds it is waiting on something that will never arrive.
# `thread` method works on Windows (the `signal` method is POSIX-only) and can
# interrupt a blocking socket read, which is the failure mode we are hunting.
# Override per test with @pytest.mark.timeout(N) if one genuinely needs longer.
timeout = 120
timeout_method = thread
markers =
    flaky: marks tests as flaky (may fail due to external API dependencies)
    flaky_env: environment-dependent (API keys present/absent) — excluded in CI via -m "not flaky_env"
    slow: marks tests as slow (external API calls, timeouts > 30s)
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:numba.*
    ignore::pytest.PytestRemovedIn10Warning
