[tool:pytest]
asyncio_mode = auto
testpaths = tests
markers =
    flaky: marks tests as flaky (may fail due to external API dependencies)
    slow: marks tests as slow (external API calls, timeouts > 30s)
    requires_artifacts: marks tests that require trained model artifacts on disk
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:numba.*
    ignore::pytest.PytestRemovedIn9Warning
